[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ping-llm"
version = "0.1.0"
description = "Decoder-only Transformer for network latency prediction"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "torch>=2.4",
    "pyarrow>=22.0.0",
    "numpy",
    "grain>=0.2.15",
    "array_record",
    "wandb",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.4",
]
eval = [
    "pandas",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ping_llm"]
